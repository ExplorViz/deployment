services:
  vs-code:
    image: explorviz/vs-code:dev
    ports:
      - 3001:80
    links:
      # necessary for mixed content (= iframe of frontend) that is not served via HTTPS
      - "frontend:localhost"
    environment:
      - VS_CODE_BACKEND_URL=http://${VSCODE_HOSTNAME}:${VSCODE_PORT}
      - FRONTEND_URL=http://${FRONTEND_HOSTNAME}:${FRONTEND_PORT}
    volumes:
      - ./projects:/home/workspace/projects
    command: --port 80

  backend-mock:
    container_name: explorviz-backend-mock
    image: explorviz/backend-mock:latest
    ports:
      - ${USER_PORT}:8084
      - ${LANDSCAPE_PORT}:8085

  vs-code-backend:
    container_name: vs-code-backend
    image: explorviz/vs-code-backend:dev
    environment:
      - EXPERIMENT_MODE=true
    ports:
      - ${VSCODE_PORT}:3000

  frontend:
    image: explorviz/frontend:latest
    ports:
      - ${FRONTEND_PORT}:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Browser URLs use the current origin automatically.
      - CODE_ANALYZER_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - LANDSCAPE_SERV_URL=http://${LANDSCAPE_HOSTNAME}:8085
      - TRACE_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - LOG_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - METRICS_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - USER_SERV_URL=http://${USER_HOSTNAME}:${USER_PORT_INTERNAL}
      - COPILOT_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - VSCODE_SERV_URL=http://${VSCODE_HOSTNAME}:${VSCODE_PORT}
      - KEYCLOAK_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}

networks:
  default:
    name: explorviz
