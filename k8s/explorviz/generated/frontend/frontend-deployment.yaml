apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: frontend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: frontend
    spec:
      containers:
        - image: explorviz/frontend:latest
          name: frontend
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: CLICKHOUSE_HOSTNAME
              value: clickhouse
            - name: CLICKHOUSE_HTTP_PORT
              value: '8123'
            - name: CLICKHOUSE_NATIVE_PORT
              value: '19000'
            - name: CLICKHOUSE_NATIVE_PORT_INTERNAL
              value: '9000'
            - name: CODE_ANALYZER_HOSTNAME
              value: code-analyzer
            - name: CODE_ANALYZER_IMAGE_TAG
              value: latest
            - name: CODE_ANALYZER_PORT
              value: '8078'
            - name: CODE_ANALYZER_PORT_INTERNAL
              value: '8078'
            - name: CODE_ANALYZER_REPOSITORIES_STORAGE
              value: code-analyzer-repositories
            - name: CODE_ANALYZER_URL
              value: http://code-analyzer.__SERVICE_DNS_SUFFIX__:8078
            - name: COLLECTOR_HOSTNAME
              value: otel-collector
            - name: COPILOT_HOSTNAME
              value: chatbot-service
            - name: COPILOT_IMAGE_TAG
              value: latest
            - name: COPILOT_PORT
              value: '4300'
            - name: COPILOT_PORT_INTERNAL
              value: '4300'
            - name: COPILOT_SERV_URL
              value: http://chatbot-service.__SERVICE_DNS_SUFFIX__:4300
            - name: EXPLORVIZ_DEMO_MODE
              value: 'false'
            - name: EXPLORVIZ_JAVA_IMAGE_TYPE
              value: jvm
            - name: FRONTEND_IMAGE_TAG
              value: latest
            - name: FRONTEND_PORT
              value: '8080'
            - name: GRAFANA_HOSTNAME
              value: grafana
            - name: KAFKA_EXT_PORT
              value: '9091'
            - name: KAFKA_HOSTNAME
              value: kafka
            - name: KAFKA_INT_PORT
              value: '9092'
            - name: KAFKA_JMX_PORT
              value: '9101'
            - name: KEYCLOAK_ADMIN_USER
              value: admin
            - name: KEYCLOAK_AUTH_ENABLED
              value: __KEYCLOAK_AUTH_ENABLED__
            - name: KEYCLOAK_DB_NAME
              value: keycloak
            - name: KEYCLOAK_DB_USER
              value: keycloak
            - name: KEYCLOAK_HOSTNAME
              value: keycloak
            - name: KEYCLOAK_PORT
              value: '5657'
            - name: KEYCLOAK_PORT_INTERNAL
              value: '8080'
            - name: KEYCLOAK_REALM
              value: explorviz
            - name: KEYCLOAK_REALM_CONFIG
              value: ./configurations/keycloak/explorviz-realm.json
            - name: KEYCLOAK_URL
              value: http://keycloak.__SERVICE_DNS_SUFFIX__:8080
            - name: LAG_EXPORTER_HOSTNAME
              value: kafka-lag-exporter
            - name: LANDSCAPE_GRPC_PORT
              value: '9000'
            - name: LANDSCAPE_HOSTNAME
              value: landscape-service
            - name: LANDSCAPE_PORT
              value: '8085'
            - name: LANDSCAPE_PORT_INTERNAL
              value: '8085'
            - name: LANDSCAPE_SERVICE_IMAGE_TAG
              value: latest
            - name: LANDSCAPE_SERV_URL
              value: http://landscape-service.__SERVICE_DNS_SUFFIX__:8085
            - name: LOG_HOSTNAME
              value: log-service
            - name: LOG_PORT
              value: '8083'
            - name: LOG_PORT_INTERNAL
              value: '8080'
            - name: LOG_REPLICAS
              value: '1'
            - name: LOG_SERVICE_IMAGE_TAG
              value: latest
            - name: LOG_SERV_URL
              value: http://log-service.__SERVICE_DNS_SUFFIX__:8080
            - name: METRICS_HOSTNAME
              value: metrics-service
            - name: METRICS_PORT
              value: '8082'
            - name: METRICS_PORT_INTERNAL
              value: '8080'
            - name: METRICS_REPLICAS
              value: '1'
            - name: METRICS_SERVICE_IMAGE_TAG
              value: latest
            - name: METRICS_SERV_URL
              value: http://metrics-service.__SERVICE_DNS_SUFFIX__:8080
            - name: MONGO_USER_HOSTNAME
              value: user-mongo
            - name: MONGO_USER_SERV_PORT
              value: '27017'
            - name: MONITORING_CADVISOR_PORT
              value: '8080'
            - name: MONITORING_GRAFANA_PORT
              value: '3000'
            - name: MONITORING_NODE_EXPORTER_PORT
              value: '9100'
            - name: MONITORING_PROMETHEUS_PORT
              value: '9090'
            - name: NEO4J_BOLT_PORT
              value: '7687'
            - name: NEO4J_BROWSER_PORT
              value: '7474'
            - name: NEO4J_HOSTNAME
              value: neo4j
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: OTEL_COLLECTOR_PORT
              value: '55678'
            - name: OTEL_COLLECTOR_ZPAGES_PORT
              value: '55679'
            - name: PROMETHEUS_HOSTNAME
              value: prometheus
            - name: PUBLIC_URL
              value: __KEYCLOAK_PUBLIC_URL__
            - name: TRACE_GENERATOR_PORT
              value: '8079'
            - name: TRACE_HOSTNAME
              value: trace-service
            - name: TRACE_PORT
              value: '8081'
            - name: TRACE_PORT_INTERNAL
              value: '8080'
            - name: TRACE_REPLICAS
              value: '1'
            - name: TRACE_SERVICE_IMAGE_TAG
              value: latest
            - name: TRACE_SERV_URL
              value: http://trace-service.__SERVICE_DNS_SUFFIX__:8080
            - name: USER_HOSTNAME
              value: user-service
            - name: USER_PORT
              value: '8084'
            - name: USER_PORT_INTERNAL
              value: '8080'
            - name: USER_SERVICE_IMAGE_TAG
              value: latest
            - name: USER_SERVICE_KC_CLIENT
              value: frontend
            - name: USER_SERV_URL
              value: http://user-service.__SERVICE_DNS_SUFFIX__:8080
            - name: VSCODE_EXT_PORT
              value: '3001'
            - name: VSCODE_HOSTNAME
              value: vs-code-backend
            - name: VSCODE_IMAGE_TAG
              value: latest
            - name: VSCODE_INT_PORT
              value: '3000'
            - name: VSCODE_SERV_URL
              value: http://vs-code-backend.__SERVICE_DNS_SUFFIX__:3000
      restartPolicy: Always
      enableServiceLinks: false
