apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: otel-collector
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: otel-collector
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
        checksum/config: 2d65e560d5ef233003d8a816cb4c7ee19e69b9dec5e7fbf717d57a472e5e4f8c
      labels:
        io.kompose.service: otel-collector
    spec:
      containers:
        - image: explorviz/otel-collector
          name: otel-collector
          ports:
            - containerPort: 4317
              protocol: TCP
            - containerPort: 55679
              protocol: TCP
          args:
            - --config=/etc/otel-collector-config.yaml
          volumeMounts:
            - name: otel-collector-config-0
              mountPath: /etc/otel-collector-config.yaml
              readOnly: true
              subPath: otel-collector-config.yaml
      restartPolicy: Always
      enableServiceLinks: false
      volumes:
        - name: otel-collector-config-0
          configMap:
            name: otel-collector-config-0
            defaultMode: 292
            items:
              - key: file-0
                path: otel-collector-config.yaml
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 clickhouse 8123; do sleep 2; done
        - name: wait-for-kafka-topics
          image: apache/kafka:4.4.0
          command:
            - /bin/sh
            - -ec
            - until topics=$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list 2>/dev/null) && printf "%s\n" "$topics" | grep -Fxq -- telemetry.entities && printf "%s\n" "$topics" | grep -Fxq -- tokens.events; do sleep 5; done
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 kafka 9092; do sleep 2; done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config-0
data:
  file-0: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: :4317

    processors:
      explorviz_parsing:
        validate_tokens: false
      attributes/add_default_landscape_token:
        actions:
          - key: explorviz.token.id
            value: "mytokenvalue"
            action: insert
          - key: explorviz.token.secret
            value: "mytokensecret"
            action: insert

    exporters:
      explorviz:
        broker: kafka:9092
        topic: telemetry.entities
        metrics:
          produce_generic_entities: true
        logs:
          produce_generic_entities: true

      clickhouse:
        endpoint: tcp://clickhouse:9000
        create_schema: false

      debug:
        verbosity: detailed

    extensions:
      explorviz_token_validator:
        broker: kafka:9092
        topic: tokens.events

    service:
      extensions: [explorviz_token_validator]
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - attributes/add_default_landscape_token
            - explorviz_parsing
          exporters:
            - explorviz
            - clickhouse
            # - debug # Uncomment for direct output to stdout

        metrics:
          receivers:
            - otlp
          processors:
            - attributes/add_default_landscape_token
            - explorviz_parsing
          exporters:
            - explorviz
            - clickhouse
            # - debug # Uncomment for direct output to stdout

        logs:
          receivers:
            - otlp
          processors:
            - attributes/add_default_landscape_token
            - explorviz_parsing
          exporters:
            - explorviz
            - clickhouse
            # - debug # Uncomment for direct output to stdout
