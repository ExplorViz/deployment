apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: chatbot-service
  name: chatbot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: chatbot-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: chatbot-service
    spec:
      containers:
        - image: explorviz/ai-chat-service:latest
          name: chatbot-service
          ports:
            - containerPort: 4300
              protocol: TCP
          envFrom:
            - secretRef:
                name: explorviz-chatbot
      restartPolicy: Always
      enableServiceLinks: false
