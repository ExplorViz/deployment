apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: grafana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
        checksum/config: 0dbd7ffc37649bdd4ba07e777ec60b554f4329988c8e7d7214478d5163c95f05
      labels:
        io.kompose.service: grafana
    spec:
      containers:
        - image: grafana/grafana:latest
          name: grafana
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-data
            - name: grafana-config-1
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: grafana-config-2
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: Main Org.
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: 'true'
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/explorviz-all.json
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
      restartPolicy: Always
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-config-1
          configMap:
            name: grafana-config-1
            defaultMode: 292
            items:
              - key: file-0
                path: dashboards/default-provider.yaml
              - key: file-1
                path: datasources/prometheus.yaml
        - name: grafana-config-2
          configMap:
            name: grafana-config-2
            defaultMode: 292
            items:
              - key: file-0
                path: explorviz-all.json
              - key: file-1
                path: landscape-service.json
              - key: file-2
                path: trace-service.json
              - key: file-3
                path: user-service.json
      enableServiceLinks: false
      initContainers:
        - name: wait-for-prometheus
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 prometheus 9090; do sleep 2; done
      securityContext:
        fsGroup: 472
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config-1
data:
  file-0: |
    apiVersion: 1

    providers:
      # <string> an unique provider name. Required
      - name: "default-provider"
        # <int> Org id. Default to 1
        orgId: 1
        # <string> name of the dashboard folder.
        folder: ""
        # <string> folder UID. will be automatically generated if not specified
        folderUid: ""
        # <string> provider type. Default to 'file'
        type: file
        # <bool> disable dashboard deletion
        disableDeletion: false
        # <int> how often Grafana will scan for changed dashboards
        updateIntervalSeconds: 10
        # <bool> allow updating provisioned dashboards from the UI
        allowUiUpdates: true
        options:
          # <string, required> path to dashboard files on disk. Required when using the 'file' type
          path: /var/lib/grafana/dashboards
          # <bool> use folder names from filesystem to create folders in Grafana
          foldersFromFilesStructure: true
  file-1: |
    # config file version
    apiVersion: 1

    # list of datasources that should be deleted from the database
    deleteDatasources:
      - name: Prometheus
        orgId: 1

    # list of datasources to insert/update depending
    # whats available in the database
    datasources:
      # <string, required> name of the datasource. Required
      - name: Prometheus
        # <string, required> datasource type. Required
        type: prometheus
        # <string, required> access mode. direct or proxy. Required
        access: proxy
        # <int> org id. will default to orgId 1 if not specified
        orgId: 1
        # <string> url
        url: http://prometheus:9090
        # <string> database password, if used
        password:
        # <string> database user, if used
        user:
        # <string> database name, if used
        database:
        # <bool> enable/disable basic auth
        basicAuth: false
        # <string> basic auth username, if used
        basicAuthUser:
        # <string> basic auth password, if used
        basicAuthPassword:
        # <bool> enable/disable with credentials headers
        withCredentials:
        # <bool> mark as default datasource. Max one per org
        isDefault: true
        # <map> fields that will be converted to json and stored in json_data
        jsonData:
          graphiteVersion: "1.1"
          tlsAuth: false
          tlsAuthWithCACert: false
        # <string> json object of data that will be encrypted.
        secureJsonData:
          tlsCACert: "..."
          tlsClientCert: "..."
          tlsClientKey: "..."
        version: 1
        # <bool> allow users to edit datasources from the UI.
        editable: true
---
