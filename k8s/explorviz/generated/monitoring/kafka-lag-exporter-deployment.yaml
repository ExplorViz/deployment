apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: kafka-lag-exporter
  name: kafka-lag-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kafka-lag-exporter
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
        checksum/config: c1f98aed37b250a8c1528ea06c3c7c5d9ff9c2f802c67a89f2e512f13d618a66
      labels:
        io.kompose.service: kafka-lag-exporter
    spec:
      containers:
        - image: seglo/kafka-lag-exporter:0.8.2
          name: kafka-lag-exporter
          ports:
            - containerPort: 8000
              protocol: TCP
          args:
            - -Dconfig.file=/opt/docker/conf/application.conf
          command:
            - bin/kafka-lag-exporter
          volumeMounts:
            - name: kafka-lag-exporter-config-0
              mountPath: /opt/docker/conf
              readOnly: true
      restartPolicy: Always
      enableServiceLinks: false
      volumes:
        - name: kafka-lag-exporter-config-0
          configMap:
            name: kafka-lag-exporter-config-0
            defaultMode: 292
            items:
              - key: file-0
                path: application.conf
              - key: file-1
                path: logback.xml
      initContainers:
        - name: wait-for-kafka-topics
          image: confluentinc/cp-kafka:7.3.15
          command:
            - /bin/sh
            - -ec
            - until topics=$(kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null) && printf "%s\n" "$topics" | grep -Fxq -- telemetry.entities && printf "%s\n" "$topics" | grep -Fxq -- tokens.events; do sleep 5; done
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 kafka 9092; do sleep 2; done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-lag-exporter-config-0
data:
  file-0: |
    kafka-lag-exporter {
      reporters.prometheus.port = 8000
      clusters = [
        {
          name = "local-explorviz-kafka"
          bootstrap-brokers = "kafka:9092"
        }
      ]
    }
  file-1: |
    <configuration>
        <variable name="ROOT_LOG_LEVEL" value="${ROOT_LOG_LEVEL:-INFO}" />
        <variable name="KAFKA_LAG_EXPORTER_LOG_LEVEL" value="${KAFKA_LAG_EXPORTER_LOG_LEVEL:-INFO}" />
        <variable name="KAFKA_LAG_EXPORTER_KAFKA_LOG_LEVEL" value="${KAFKA_LAG_EXPORTER_KAFKA_LOG_LEVEL:-INFO}" />
        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%date{ISO8601} %-5level %logger{36} %X{akkaSource} - %msg %ex%n</pattern>
            </encoder>
        </appender>
        <logger name="org.apache.kafka" level="${KAFKA_LAG_EXPORTER_KAFKA_LOG_LEVEL}"/>
        <logger name="com.lightbend.kafkalagexporter" level="${KAFKA_LAG_EXPORTER_LOG_LEVEL}"/>
        <root level="${ROOT_LOG_LEVEL}">
            <appender-ref ref="STDOUT" />
        </root>
    </configuration>
