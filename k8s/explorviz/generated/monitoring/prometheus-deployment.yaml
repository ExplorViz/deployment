apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: prometheus
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: prometheus
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
        checksum/config: 9a5c7260aaf5d30846c63fc28fee852c0798379ac42e73e5339488628b6feb24
      labels:
        io.kompose.service: prometheus
    spec:
      containers:
        - image: prom/prometheus:latest
          name: prometheus
          ports:
            - containerPort: 9090
              protocol: TCP
          volumeMounts:
            - mountPath: /prometheus
              name: prometheus-data
            - name: prometheus-config-0
              mountPath: /etc/prometheus
              readOnly: true
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
      restartPolicy: Always
      volumes:
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: prometheus-config-0
          configMap:
            name: prometheus-config-0
            defaultMode: 292
            items:
              - key: file-0
                path: prometheus.yml
      enableServiceLinks: false
      securityContext:
        fsGroup: 65534
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config-0
data:
  file-0: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: null
    scrape_configs:
    - job_name: kafka-lag-exporter
      static_configs:
      - targets:
        - kafka-lag-exporter:8000
    - job_name: landscape-service
      metrics_path: /q/metrics
      dns_sd_configs:
      - names:
        - landscape-service
        type: A
        port: 8085
      static_configs: []
    - job_name: trace-service
      metrics_path: /q/metrics
      dns_sd_configs:
      - names:
        - trace-service
        type: A
        port: 8080
      static_configs: []
    - job_name: user-service
      metrics_path: /q/metrics
      dns_sd_configs:
      - names:
        - user-service
        type: A
        port: 8080
      static_configs: []
    - job_name: push-service
      metrics_path: /q/metrics
      dns_sd_configs:
      - names:
        - push-service
        type: A
        port: 8080
      static_configs: []
