apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: user-service
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: user-service
    spec:
      containers:
        - image: explorviz/user-service-jvm:latest
          name: user-service
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: CLICKHOUSE_HOSTNAME
              value: clickhouse
            - name: CLICKHOUSE_HTTP_PORT
              value: '8123'
            - name: CLICKHOUSE_NATIVE_PORT
              value: '19000'
            - name: CLICKHOUSE_NATIVE_PORT_INTERNAL
              value: '9000'
            - name: CODE_ANALYZER_HOSTNAME
              value: code-analyzer
            - name: CODE_ANALYZER_IMAGE_TAG
              value: latest
            - name: CODE_ANALYZER_PORT
              value: '8078'
            - name: CODE_ANALYZER_PORT_INTERNAL
              value: '8078'
            - name: CODE_ANALYZER_REPOSITORIES_STORAGE
              value: code-analyzer-repositories
            - name: COLLABORATION_HOSTNAME
              value: collaboration-service
            - name: COLLABORATION_PORT
              value: '2567'
            - name: COLLABORATION_PORT_INTERNAL
              value: '2567'
            - name: COLLABORATION_SERVICE_IMAGE_TAG
              value: latest
            - name: COLLECTOR_HOSTNAME
              value: otel-collector
            - name: COPILOT_HOSTNAME
              value: chatbot-service
            - name: COPILOT_IMAGE_TAG
              value: latest
            - name: COPILOT_PORT
              value: '4300'
            - name: COPILOT_PORT_INTERNAL
              value: '4300'
            - name: EXPLORVIZ_DEMO_MODE
              value: 'false'
            - name: EXPLORVIZ_JAVA_IMAGE_TYPE
              value: jvm
            - name: EXPLORVIZ_LOG_LVL
              value: DEBUG
            - name: FRONTEND_IMAGE_TAG
              value: latest
            - name: FRONTEND_PORT
              value: '8080'
            - name: GRAFANA_HOSTNAME
              value: grafana
            - name: INIT_TOKEN_ENABLED
              value: 'true'
            - name: INIT_TOKEN_SECRET
              value: mytokensecret
            - name: INIT_TOKEN_VALUE
              value: mytokenvalue
            - name: KAFKA_EXT_PORT
              value: '9091'
            - name: KAFKA_HOSTNAME
              value: kafka
            - name: KAFKA_INT_PORT
              value: '9092'
            - name: KAFKA_JMX_PORT
              value: '9101'
            - name: KEYCLOAK_ADMIN_USER
              value: admin
            - name: KEYCLOAK_AUTH_ENABLED
              value: 'false'
            - name: KEYCLOAK_DB_NAME
              value: keycloak
            - name: KEYCLOAK_DB_USER
              value: keycloak
            - name: KEYCLOAK_HOSTNAME
              value: keycloak
            - name: KEYCLOAK_PORT
              value: '5657'
            - name: KEYCLOAK_PORT_INTERNAL
              value: '8080'
            - name: KEYCLOAK_REALM
              value: explorviz
            - name: KEYCLOAK_REALM_CONFIG
              value: ./configurations/keycloak/explorviz-realm.json
            - name: LAG_EXPORTER_HOSTNAME
              value: kafka-lag-exporter
            - name: LANDSCAPE_GRPC_PORT
              value: '9000'
            - name: LANDSCAPE_HOSTNAME
              value: landscape-service
            - name: LANDSCAPE_PORT
              value: '8085'
            - name: LANDSCAPE_PORT_INTERNAL
              value: '8085'
            - name: LANDSCAPE_SERVICE_IMAGE_TAG
              value: latest
            - name: LOG_HOSTNAME
              value: log-service
            - name: LOG_PORT
              value: '8083'
            - name: LOG_PORT_INTERNAL
              value: '8080'
            - name: LOG_SERVICE_IMAGE_TAG
              value: latest
            - name: METRICS_HOSTNAME
              value: metrics-service
            - name: METRICS_PORT
              value: '8082'
            - name: METRICS_PORT_INTERNAL
              value: '8080'
            - name: METRICS_SERVICE_IMAGE_TAG
              value: latest
            - name: MONGO_USER_HOSTNAME
              value: mongo-user
            - name: MONGO_USER_SERV_PORT
              value: '27017'
            - name: MONITORING_CADVISOR_PORT
              value: '8080'
            - name: MONITORING_GRAFANA_PORT
              value: '3000'
            - name: MONITORING_NODE_EXPORTER_PORT
              value: '9100'
            - name: MONITORING_PROMETHEUS_PORT
              value: '9090'
            - name: NEO4J_BOLT_PORT
              value: '7687'
            - name: NEO4J_BROWSER_PORT
              value: '7474'
            - name: NEO4J_HOSTNAME
              value: neo4j
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: OTEL_COLLECTOR_PORT
              value: '4317'
            - name: OTEL_COLLECTOR_ZPAGES_PORT
              value: '55679'
            - name: PROMETHEUS_HOSTNAME
              value: prometheus
            - name: PUBLIC_URL
              value: __KEYCLOAK_PUBLIC_URL__
            - name: QUARKUS_HTTP_CORS_ENABLED
              value: 'false'
            - name: QUARKUS_MONGODB_CONNECTION_STRING
              value: mongodb://mongo-user:27017
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: http://keycloak:8080/realms/explorviz
            - name: QUARKUS_OIDC_CLIENT_ID
              value: frontend
            - name: QUARKUS_OIDC_ENABLED
              value: __KEYCLOAK_AUTH_ENABLED__
            - name: QUARKUS_OIDC_JWKS_PATH
              value: /protocol/openid-connect/certs
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: __KEYCLOAK_PUBLIC_URL__/realms/explorviz
            - name: TRACE_GENERATOR_PORT
              value: '8079'
            - name: TRACE_HOSTNAME
              value: trace-service
            - name: TRACE_PORT
              value: '8081'
            - name: TRACE_PORT_INTERNAL
              value: '8080'
            - name: TRACE_SERVICE_IMAGE_TAG
              value: latest
            - name: USER_HOSTNAME
              value: user-service
            - name: USER_PORT
              value: '8084'
            - name: USER_PORT_INTERNAL
              value: '8080'
            - name: USER_SERVICE_IMAGE_TAG
              value: latest
            - name: USER_SERVICE_KC_CLIENT
              value: frontend
            - name: VSCODE_EXT_PORT
              value: '3001'
            - name: VSCODE_HOSTNAME
              value: vs-code-backend
            - name: VSCODE_IMAGE_TAG
              value: latest
            - name: VSCODE_INT_PORT
              value: '3000'
      restartPolicy: Always
      enableServiceLinks: false
      initContainers:
        - name: wait-for-kafka-topics
          image: confluentinc/cp-kafka:7.3.15
          command:
            - /bin/sh
            - -ec
            - until topics=$(kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null) && printf "%s\n" "$topics" | grep -Fxq -- telemetry.entities && printf "%s\n" "$topics" | grep -Fxq -- tokens.events; do sleep 5; done
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 kafka 9092; do sleep 2; done
        - name: wait-for-mongo-user
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 mongo-user 27017; do sleep 2; done
