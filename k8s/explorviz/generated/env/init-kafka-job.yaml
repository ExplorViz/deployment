apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: init-kafka
  name: init-kafka-d4a3bb348d
spec:
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
        checksum/config: dfb772a469ea4124e92af3a7faf58e8f8aea268cead49fb54d73c4069437ff3c
      labels:
        io.kompose.service: init-kafka
    spec:
      containers:
        - image: confluentinc/cp-kafka:7.3.15
          name: init-kafka
          env:
            - name: KAFKA_INT_PORT
              value: '9092'
          command:
            - /bin/sh
            - -ec
          args:
            - . /tmp/init_kafka_topics.sh
          volumeMounts:
            - name: init-kafka-config-2
              mountPath: /tmp/init_kafka_topics.sh
              readOnly: true
              subPath: init_kafka_topics.sh
      restartPolicy: Never
      enableServiceLinks: false
      volumes:
        - name: init-kafka-config-2
          configMap:
            name: init-kafka-config-2
            defaultMode: 365
            items:
              - key: file-0
                path: init_kafka_topics.sh
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z -w 2 kafka 9092; do sleep 2; done
  backoffLimit: 6
  activeDeadlineSeconds: 600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-kafka-config-2
data:
  file-0: |
    #!/bin/sh

    echo -e 'Creating kafka topics'

    kafka-topics --bootstrap-server kafka:${KAFKA_INT_PORT} --create --if-not-exists --topic telemetry.entities --replication-factor 1 --partitions 1

    kafka-topics --bootstrap-server kafka:${KAFKA_INT_PORT} --create --if-not-exists --topic tokens.events --replication-factor 1 --partitions 20

    echo -e 'Successfully created the following topics:'
    kafka-topics --bootstrap-server kafka:${KAFKA_INT_PORT} --list
