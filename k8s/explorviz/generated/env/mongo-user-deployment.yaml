apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mongo-user
  name: mongo-user
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mongo-user
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mongo-user
    spec:
      containers:
        - image: mongo:6.0
          name: mongo-user
          ports:
            - containerPort: 27017
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db
              name: user-mongo-data
            - mountPath: /data/configdb
              name: user-mongo-configdb
      restartPolicy: Always
      volumes:
        - name: user-mongo-data
          persistentVolumeClaim:
            claimName: user-mongo-data
        - name: user-mongo-configdb
          persistentVolumeClaim:
            claimName: user-mongo-configdb
      enableServiceLinks: false
