apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: neo4j
  name: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: neo4j
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
        checksum/config: 03ff7c774a35a0f9a9b6b7f179b0065ddcc361afc79e659360ba05e410bf0465
      labels:
        io.kompose.service: neo4j
    spec:
      containers:
        - image: neo4j:2026.10.1
          name: neo4j
          ports:
            - containerPort: 7474
              protocol: TCP
            - containerPort: 7687
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: neo4j
            - mountPath: /plugins
              name: neo4j-plugins
            - name: neo4j-config-2
              mountPath: /startup/cached-plugins.sh
              readOnly: true
              subPath: cached-plugins.sh
            - name: neo4j-config-3
              mountPath: /import/init.cypher
              readOnly: true
              subPath: init.cypher
          env:
            - name: NEO4J_AUTH
              value: none
            - name: NEO4J_PLUGINS
              value: '["apoc", "apoc-extended"]'
            - name: NEO4J_apoc_import_file_enabled
              value: 'true'
            - name: NEO4J_apoc_initializer_neo4j_0
              value: CALL apoc.cypher.runSchemaFile("init.cypher")
            - name: NEO4J_db_query_default__language
              value: CYPHER_25
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: apoc.*
            - name: NEO4J_dbms_usage__report_enabled
              value: 'false'
          command:
            - tini
            - -g
            - --
            - /bin/sh
            - /startup/cached-plugins.sh
          args:
            - neo4j
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - '</dev/tcp/127.0.0.1/7687 && wget -qO /dev/null --header ''Content-Type: application/json'' --post-data ''{"statement":"RETURN 1"}'' http://127.0.0.1:7474/db/neo4j/query/v2'
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 10
      restartPolicy: Always
      volumes:
        - name: neo4j
          persistentVolumeClaim:
            claimName: neo4j
        - name: neo4j-plugins
          persistentVolumeClaim:
            claimName: neo4j-plugins
        - name: neo4j-config-2
          configMap:
            name: neo4j-config-2
            defaultMode: 365
            items:
              - key: file-0
                path: cached-plugins.sh
        - name: neo4j-config-3
          configMap:
            name: neo4j-config-3
            defaultMode: 292
            items:
              - key: file-0
                path: init.cypher
      enableServiceLinks: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-config-2
data:
  file-0: |
    #!/bin/sh
    set -eu

    # The upstream installer downloads APOC Extended on every invocation. Reuse
    # complete JARs from the plugin volume, including after container recreation.
    # Validate archives so an interrupted download is retried on the next startup,
    # and discard JARs that were installed for a different Neo4j version.
    version_file=/plugins/.neo4j-version
    version="$(basename "$(ls "${NEO4J_HOME:-/var/lib/neo4j}"/lib/neo4j-kernel-[0-9]*.jar)" .jar)"
    if [ "$(cat "$version_file" 2>/dev/null)" = "$version" ] &&
       jar tf /plugins/apoc.jar >/dev/null 2>&1 &&
       jar tf /plugins/apoc-extended.jar >/dev/null 2>&1; then
        echo "Using cached Neo4j APOC plugins."
        unset NEO4J_PLUGINS
    else
        rm -f /plugins/apoc.jar /plugins/apoc-extended.jar
        echo "$version" > "$version_file"
    fi

    exec /startup/docker-entrypoint.sh "$@"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-config-3
data:
  file-0: |
    CREATE CONSTRAINT landscape_token_id IF NOT EXISTS FOR (l:Landscape) REQUIRE l.tokenId IS UNIQUE;
    CREATE INDEX directory_name IF NOT EXISTS FOR (d:Directory) ON (d.name);
    CREATE INDEX file_revision_hash_name IF NOT EXISTS FOR (f:FileRevision) ON (f.hash, f.name);
    CREATE INDEX file_revision_repo_file_path_hash IF NOT EXISTS FOR (f:FileRevision) ON (f.repoName, f.filePath, f.hash);
    CREATE INDEX file_revision_repo_file_path IF NOT EXISTS FOR (f:FileRevision) ON (f.repoName, f.filePath);
    CREATE INDEX file_revision_repo_name IF NOT EXISTS FOR (f:FileRevision) ON (f.repoName, f.name);
    CREATE INDEX file_revision_lookup_key IF NOT EXISTS FOR (f:FileRevision) ON (f.lookupKey);
    CREATE INDEX function_name IF NOT EXISTS FOR (f:Function) ON (f.name);
    CREATE INDEX commit_hash IF NOT EXISTS FOR (c:Commit) ON (c.hash);
    CREATE INDEX commit_commit_date IF NOT EXISTS FOR (c:Commit) ON (c.commitDate);
    CREATE INDEX commit_has_accumulated_metrics IF NOT EXISTS FOR (c:Commit) ON (c.hasAccumulatedMetrics);
    CREATE INDEX file_revision_has_file_data IF NOT EXISTS FOR (f:FileRevision) ON (f.hasFileData);
