apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: trace-generator
  name: trace-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: trace-generator
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: trace-generator
    spec:
      containers:
        - image: explorviz/trace-generator
          name: trace-generator
          ports:
            - containerPort: 8079
              protocol: TCP
      restartPolicy: Always
      enableServiceLinks: false
