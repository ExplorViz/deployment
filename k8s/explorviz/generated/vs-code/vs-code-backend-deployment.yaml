apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: vs-code-backend
  name: vs-code-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: vs-code-backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f explorviz.yaml convert --chart --pvc-request-size 1Gi
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: vs-code-backend
    spec:
      containers:
        - image: explorviz/vs-code-backend:latest
          name: vs-code-backend
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: EXPERIMENT_MODE
              value: 'true'
      restartPolicy: Always
      enableServiceLinks: false
