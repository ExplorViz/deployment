# Contains non-Java ExplorViz components

# Start with top-level compose.yaml.

include:
  - ./compose.extra.yaml

services:
  frontend:
    hostname: frontend
    image: explorviz/frontend:${FRONTEND_IMAGE_TAG}
    profiles: ["frontend"]
    env_file:
      - path: ../.env
      - path: ../.env-custom
        required: false
    ports:
      - ${FRONTEND_PORT}:80
    environment:
      # Browser URLs are same-origin; these addresses are used only by nginx.
      - KEYCLOAK_AUTH_ENABLED=${KEYCLOAK_AUTH_ENABLED}
      - CODE_ANALYZER_URL=http://${CODE_ANALYZER_HOSTNAME}:${CODE_ANALYZER_PORT_INTERNAL}
      - COPILOT_SERV_URL=http://${COPILOT_HOSTNAME}:${COPILOT_PORT_INTERNAL}
      - KEYCLOAK_URL=http://${KEYCLOAK_HOSTNAME}:${KEYCLOAK_PORT_INTERNAL}
      - LANDSCAPE_SERV_URL=http://${LANDSCAPE_HOSTNAME}:${LANDSCAPE_PORT_INTERNAL}
      - TRACE_SERV_URL=http://${TRACE_HOSTNAME}:${TRACE_PORT_INTERNAL}
      - LOG_SERV_URL=http://${LOG_HOSTNAME}:${LOG_PORT_INTERNAL}
      - METRICS_SERV_URL=http://${METRICS_HOSTNAME}:${METRICS_PORT_INTERNAL}
      - USER_SERV_URL=http://${USER_HOSTNAME}:${USER_PORT_INTERNAL}
      - VSCODE_SERV_URL=http://${VSCODE_HOSTNAME}:${VSCODE_INT_PORT}
