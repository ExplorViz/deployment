# Contains extra software for ExplorViz

# If you only want to use it without dockerized ExplorViz:

# Start: `docker compose -f compose.extra.yaml --env-file ../.env up -d`
# Stop and remove volumes: `docker compose -f compose.extra.yaml --env-file ../.env down -v`

services:
  #region Environment

  ## Kafka ##

  kafka:
    # GraalVM native image: The broker is ready in less than a second.
    # It is intended for development and ships without the Kafka CLI tools.
    image: apache/kafka-native:4.4.0
    hostname: ${KAFKA_HOSTNAME}
    profiles: ["env"]
    # A new named volume is owned by root, since the image has no data directory.
    user: root
    ports:
      - "${KAFKA_EXT_PORT}:${KAFKA_EXT_PORT}"
      - "${KAFKA_JMX_PORT}:${KAFKA_JMX_PORT}"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:${KAFKA_INT_PORT},PLAINTEXT_HOST://localhost:${KAFKA_EXT_PORT}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: ${KAFKA_JMX_PORT}
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_MESSAGE_MAX_BYTES: 10485880
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:${KAFKA_INT_PORT},CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:${KAFKA_EXT_PORT}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # After an unclean stop the broker can only re-register once its old
      # session expired. The default of 9s delays the restart accordingly.
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 3000
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 1000
    volumes:
      - kafka-4-data:/var/lib/kafka/data
      - kafka-secrets:/etc/kafka/secrets
    healthcheck:
      # The image has no Kafka CLI tools, so only check that the listener,
      # which is bound to all interfaces, accepts connections. Services which
      # need a working broker also wait for init-kafka.
      test: ["CMD", "nc", "-z", "localhost", "${KAFKA_EXT_PORT}"]
      interval: 15s
      timeout: 10s
      retries: 10
      # Probe every second while starting, so that dependent services are not
      # held back by the regular interval (requires Docker Engine 25+).
      start_period: 60s
      start_interval: 1s

  init-kafka:
    # JVM-based image of the same version, since it includes the Kafka CLI tools.
    image: apache/kafka:4.4.0
    profiles: ["env", "init-env"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_INT_PORT
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - init-kafka-data:/var/lib/kafka/data
      - init-kafka-secrets:/etc/kafka/secrets
      - ./configurations/kafka/init_kafka_topics.sh:/tmp/init_kafka_topics.sh
    command: "/tmp/init_kafka_topics.sh"

  ## Neo4j

  neo4j:
    image: neo4j:2026.10.1
    entrypoint: ["tini", "-g", "--", "/bin/sh", "/startup/cached-plugins.sh"]
    command: ["neo4j"]
    hostname: ${NEO4J_HOSTNAME}
    profiles: ["env"]
    ports:
      - ${NEO4J_BROWSER_PORT}:7474
      - ${NEO4J_BOLT_PORT}:7687
    volumes:
      - neo4j:/data
      - neo4j-plugins:/plugins
      - ./configurations/neo4j/cached-plugins.sh:/startup/cached-plugins.sh:ro
      - ./configurations/neo4j/init.cypher:/import/init.cypher
    environment:
      - NEO4J_AUTH=none
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_db_query_default__language=CYPHER_25
      - NEO4J_PLUGINS=["apoc", "apoc-extended"]
      # Also needed when the wrapper skips the plugin installer on cached starts.
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_initializer_neo4j_0=CALL apoc.cypher.runSchemaFile("init.cypher")
    healthcheck:
      # Check that Bolt, which is used by landscape-service, accepts connections
      # and that the database answers a query. The query is sent to the HTTP
      # API, since cypher-shell would start a JVM for every probe.
      test:
        - CMD
        - bash
        - -c
        - >-
          </dev/tcp/127.0.0.1/7687 &&
          wget -qO /dev/null --header 'Content-Type: application/json'
          --post-data '{"statement":"RETURN 1"}'
          http://127.0.0.1:7474/db/neo4j/query/v2
      interval: 15s
      timeout: 30s
      retries: 10
      # Initial plugin downloads and database recovery can delay readiness.
      start_period: 5m
      # Probe every second while starting, so that dependent services are not
      # held back by the regular interval (requires Docker Engine 25+).
      start_interval: 1s

  ## ClickHouse ##

  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    hostname: ${CLICKHOUSE_HOSTNAME}
    profiles: ["otel"]
    restart: always
    ports:
      - ${CLICKHOUSE_HTTP_PORT}:8123
      - ${CLICKHOUSE_NATIVE_PORT}:9000
    volumes:
      - ./configurations/clickhouse:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server/
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # On the first start the entrypoint runs the init scripts against a
      # temporary server, which only listens on localhost and is stopped
      # afterwards. Probe the container's own address, so that only the final
      # server is reported as healthy.
      test: ["CMD-SHELL", "wget -q --spider http://$$(hostname):8123/ping"]
      interval: 5s
      timeout: 10s
      retries: 10
      # Probe every second while starting, so that dependent services are not
      # held back by the regular interval (requires Docker Engine 25+).
      start_period: 60s
      start_interval: 1s

  ## User-Service ##

  mongo-user:
    image: mongo:6.0
    hostname: ${MONGO_USER_HOSTNAME}
    profiles: ["env"]
    ports:
      - ${MONGO_USER_SERV_PORT}:27017
    volumes:
      - user-mongo-data:/data/db
      - user-mongo-configdb:/data/configdb

  #endregion Environment

  #region generator

  trace-generator:
    image: explorviz/trace-generator
    profiles: ["generator"]
    ports:
      - ${TRACE_GENERATOR_PORT}:8079
    extra_hosts:
      - "localhost:host-gateway"

  #endregion generator

  #region monitoring

  prometheus:
    hostname: ${PROMETHEUS_HOSTNAME}
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./configurations/monitoring/prometheus/:/etc/prometheus/
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    expose:
      - ${MONITORING_PROMETHEUS_PORT}
    ports:
      - ${MONITORING_PROMETHEUS_PORT}:${MONITORING_PROMETHEUS_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kafka-lag-exporter:
    hostname: ${LAG_EXPORTER_HOSTNAME}
    image: seglo/kafka-lag-exporter:0.8.2
    profiles: ["monitoring"]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    volumes:
      - ./configurations/monitoring/kafka-lag-exporter:/opt/docker/conf
    command: "bin/kafka-lag-exporter -Dconfig.file=/opt/docker/conf/application.conf"

  grafana:
    image: grafana/grafana:latest
    hostname: ${GRAFANA_HOSTNAME}
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configurations/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./configurations/monitoring/grafana/src:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/explorviz-all.json
    ports:
      - ${MONITORING_GRAFANA_PORT}:${MONITORING_GRAFANA_PORT}

#endregion monitoring

#region auth

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: keycloak
    depends_on:
      - postgres-keycloak
    profiles:
      - auth
    command:
      - start-dev
      - --import-realm
    volumes:
      - ${KEYCLOAK_REALM_CONFIG}:/opt/keycloak/data/import/explorviz-realm.json
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080" # Binding to localhost avoids https errors
    env_file:
      - ../.env
    environment:
      #db config
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PWD}

      # admin config
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}

      # network config
      KC_HTTP_HOST: "0.0.0.0"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PUBLIC_URL}
      # Keycloak substitutes this variable in the initial realm import.
      PUBLIC_URL: ${PUBLIC_URL}
    networks:
      - default

  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    profiles: ["auth"]
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PWD}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

#endregion auth

#region VSCode

  vs-code-backend:
    image: explorviz/vs-code-backend:${VSCODE_IMAGE_TAG}
    hostname: ${VSCODE_HOSTNAME}
    profiles: ["vs-code"]
    environment:
      - EXPERIMENT_MODE=true
    ports:
      - ${VSCODE_EXT_PORT}:3000

#endregion VSCode

#region Volumes + Network

# Delete all ExplorViz volumes:
# docker volume rm $(docker volume ls -f name=explorviz -q)

volumes:
  # Data of the former Confluent image (Kafka 3.3) cannot be reused.
  kafka-4-data:
    name: explorviz-kafka-4-data
  kafka-secrets:
    name: explorviz-kafka-secrets
  init-kafka-data:
    name: explorviz-init-kafka-data
  init-kafka-secrets:
    name: explorviz-init-kafka-secrets
  user-mongo-data:
    name: explorviz-mongo-user-data
  user-mongo-configdb:
    name: explorviz-mongo-user-config
  neo4j:
    name: neo4j
  neo4j-plugins:
    # Keep this version aligned with the image to avoid reusing incompatible JARs.
    name: explorviz-neo4j-plugins-2026.10.1
  clickhouse-data:
    name: explorviz-clickhouse-data
  clickhouse-logs:
    name: explorviz-clickhouse-logs
  prometheus-data:
    name: explorviz-prometheus-data
  grafana-data:
    name: explorviz-grafana-data
  postgres-keycloak-data:
    name: explorviz-postgres-keycloak-data

networks:
  default:
    name: explorviz
#endregion Volumes + Network
