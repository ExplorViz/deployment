services:
  frontend:
    container_name: frontend
    image: explorviz/frontend:${FRONTEND_IMAGE_TAG}
    ports:
      - "${FRONTEND_PORT}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Browser URLs use the current origin automatically.
      - FRONTEND_HOST_URL=${PUBLIC_URL}
      - CODE_ANALYZER_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - LANDSCAPE_SERV_URL=http://${MOCK_HOSTNAME}:${LANDSCAPE_PORT}
      - TRACE_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - METRICS_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - LOG_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - COPILOT_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - USER_SERV_URL=http://${MOCK_HOSTNAME}:${USER_PORT}
      - VSCODE_SERV_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}
      - KEYCLOAK_URL=http://${MOCK_HOSTNAME}:${MOCK_PORT}

  backend-mock:
    container_name: explorviz-backend-mock
    image: explorviz/backend-mock:${BACKEND_MOCK_IMAGE_TAG}
    hostname: ${MOCK_HOSTNAME}
    ports:
      - "${USER_PORT}:8084"
      - "${LANDSCAPE_PORT}:8085"

networks:
  default:
    name: explorviz
